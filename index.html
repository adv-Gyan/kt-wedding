    <!-- Autoplay music on index -->
    <audio id="bg-music-index" loop autoplay>
        <source src="https://framerusercontent.com/assets/tHk7xrivW8bDCdhOyDo3Sw3P4D4.mp3" type="audio/mpeg">
    </audio>
    <script>
        // Autoplay with user gesture fallback
        const audio = document.getElementById('bg-music-index');
        audio.volume = 0.5;
        function tryPlay() {
            audio.play().catch(() => {
                document.addEventListener('click', () => audio.play(), { once: true });
                document.addEventListener('touchstart', () => audio.play(), { once: true });
            });
        }
        document.addEventListener('DOMContentLoaded', tryPlay);

        // Before navigating to save-the-date, save music position
        document.querySelectorAll('a[href="save-the-date.html"]').forEach(link => {
            link.addEventListener('click', () => {
                sessionStorage.setItem('musicTime', audio.currentTime);
                sessionStorage.setItem('musicPlaying', !audio.paused);
            });
        });
    </script>
